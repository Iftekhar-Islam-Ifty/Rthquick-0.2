<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ornBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#E8DCBE"/>
    </linearGradient>
    <radialGradient id="goldGleam" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8DCBE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#ornBg)"/>
  <circle cx="200" cy="175" r="135" fill="url(#goldGleam)"/>
  <!-- Artisan Jewellery / Traditional Filigree Jhumka & Choker -->
  <g transform="translate(100, 75)" stroke="#B8966A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Crescent Filigree Choker -->
    <path d="M30,70 Q100,120 170,70" stroke="#1B3A4B" stroke-width="2"/>
    <path d="M40,85 Q100,140 160,85" stroke="#B8966A" stroke-width="2.5"/>
    <path d="M55,100 Q100,155 145,100" stroke="#B8966A" stroke-width="2" stroke-dasharray="2 6"/>
    <!-- Central Statement Pendant -->
    <path d="M85,150 C85,130 115,130 115,150 L120,180 C120,195 80,195 80,180 Z" fill="#B8966A" fill-opacity="0.2" stroke="#1B3A4B" stroke-width="2.5"/>
    <circle cx="100" cy="162" r="5" fill="#B8966A" stroke="none"/>
    <!-- Hanging pearls/drops -->
    <line x1="85" y1="190" x2="85" y2="215"/>
    <circle cx="85" cy="218" r="3" fill="#B8966A"/>
    <line x1="100" y1="192" x2="100" y2="225"/>
    <circle cx="100" cy="228" r="4" fill="#B8966A"/>
    <line x1="115" y1="190" x2="115" y2="215"/>
    <circle cx="115" cy="218" r="3" fill="#B8966A"/>
    <!-- Sparkle Stars -->
    <path d="M45,120 L48,127 L55,129 L48,131 L45,138 L42,131 L35,129 L42,127 Z" fill="#B8966A" stroke="none"/>
    <path d="M155,120 L158,127 L165,129 L158,131 L155,138 L152,131 L145,129 L152,127 Z" fill="#B8966A" stroke="none"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="600" letter-spacing="4" fill="#1B3A4B">ARTISAN ORNAMENTS</text>
</svg>
