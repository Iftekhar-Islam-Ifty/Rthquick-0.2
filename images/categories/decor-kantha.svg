<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="kanthaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#EDE1D1"/>
    </linearGradient>
    <pattern id="stitchPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="2" y1="10" x2="8" y2="10" stroke="#B8966A" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="12" y1="10" x2="18" y2="10" stroke="#1B3A4B" stroke-width="1.2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <!-- Background Quilt Surface -->
  <rect width="500" height="650" fill="url(#kanthaBg)"/>
  <!-- Layer of subtle running stitch pattern -->
  <rect x="25" y="25" width="450" height="600" rx="14" fill="#F7F1E6" stroke="#D1C3B2" stroke-width="1.5"/>
  <rect x="40" y="40" width="420" height="570" fill="url(#stitchPattern)" opacity="0.45"/>
  
  <!-- Outer Decorative Border Frame -->
  <rect x="55" y="55" width="390" height="540" fill="none" stroke="#B8966A" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="65" y="65" width="370" height="520" fill="none" stroke="#1B3A4B" stroke-width="1.5"/>
  
  <!-- Central Botanical Nakshi Mandala -->
  <g transform="translate(250, 310)">
    <!-- Outer Petal Ring -->
    <circle cx="0" cy="0" r="110" fill="#E6D7C3" opacity="0.6"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#8B1E2B" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- 8 Embroidered Leaves -->
    <path d="M0,-95 Q25,-60 0,-25 Q-25,-60 0,-95 Z" fill="#2E5A44" stroke="#1B3A4B" stroke-width="1.2"/>
    <path d="M0,95 Q25,60 0,25 Q-25,60 0,95 Z" fill="#2E5A44" stroke="#1B3A4B" stroke-width="1.2"/>
    <path d="M-95,0 Q-60,25 -25,0 Q-60,-25 -95,0 Z" fill="#2E5A44" stroke="#1B3A4B" stroke-width="1.2"/>
    <path d="M95,0 Q60,25 25,0 Q60,-25 95,0 Z" fill="#2E5A44" stroke="#1B3A4B" stroke-width="1.2"/>
    <path d="M-67,-67 Q-35,-50 -18,-18 Q-50,-35 -67,-67 Z" fill="#C9962F" stroke="#1B3A4B" stroke-width="1.2"/>
    <path d="M67,67 Q35,50 18,18 Q50,35 67,67 Z" fill="#C9962F" stroke="#1B3A4B" stroke-width="1.2"/>
    <path d="M-67,67 Q-50,35 -18,18 Q-35,50 -67,67 Z" fill="#8B1E2B" stroke="#1B3A4B" stroke-width="1.2"/>
    <path d="M67,-67 Q50,-35 18,-18 Q35,-50 67,-67 Z" fill="#8B1E2B" stroke="#1B3A4B" stroke-width="1.2"/>
    
    <!-- Inner Lotus Core -->
    <circle cx="0" cy="0" r="35" fill="#FAF5EE" stroke="#B8966A" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="22" fill="#8B1E2B" opacity="0.85"/>
    <circle cx="0" cy="0" r="8" fill="#C9962F"/>
    
    <!-- Fine Kantha Stitches across motif -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#1B3A4B" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#1B3A4B" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
  
  <!-- Corner Floral Ornaments -->
  <g transform="translate(90, 90)">
    <circle cx="0" cy="0" r="14" fill="#C9962F" opacity="0.8"/>
    <path d="M0,0 Q15,0 15,15 Q0,15 0,0" fill="#8B1E2B"/>
  </g>
  <g transform="translate(410, 90)">
    <circle cx="0" cy="0" r="14" fill="#C9962F" opacity="0.8"/>
    <path d="M0,0 Q-15,0 -15,15 Q0,15 0,0" fill="#8B1E2B"/>
  </g>
  <g transform="translate(90, 530)">
    <circle cx="0" cy="0" r="14" fill="#C9962F" opacity="0.8"/>
    <path d="M0,0 Q15,0 15,-15 Q0,-15 0,0" fill="#8B1E2B"/>
  </g>
  <g transform="translate(410, 530)">
    <circle cx="0" cy="0" r="14" fill="#C9962F" opacity="0.8"/>
    <path d="M0,0 Q-15,0 -15,-15 Q0,-15 0,0" fill="#8B1E2B"/>
  </g>

  <!-- Typography Banner -->
  <rect x="110" y="565" width="280" height="34" rx="6" fill="#1B3A4B"/>
  <text x="250" y="587" text-anchor="middle" font-family="'Fraunces', serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#FAF5EE">NAKSHI KANTHA QUILT</text>
</svg>
