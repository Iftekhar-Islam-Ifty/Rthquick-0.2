<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF3F6"/>
      <stop offset="100%" stop-color="#D7E2E9"/>
    </linearGradient>
    <pattern id="indigoFloral" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="6" fill="#1B3A4B" opacity="0.35"/>
      <circle cx="20" cy="20" r="2.5" fill="#C9962F"/>
      <path d="M20,10 Q24,15 20,20 Q16,15 20,10 Z" fill="#1B3A4B" opacity="0.5"/>
      <path d="M20,30 Q24,25 20,20 Q16,25 20,30 Z" fill="#1B3A4B" opacity="0.5"/>
      <path d="M10,20 Q15,24 20,20 Q15,16 10,20 Z" fill="#1B3A4B" opacity="0.5"/>
      <path d="M30,20 Q25,24 20,20 Q25,16 30,20 Z" fill="#1B3A4B" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="500" height="650" fill="url(#bedBg)"/>
  
  <!-- Draped Luxury Bedsheet Perspective Presentation -->
  <g transform="translate(30, 40)">
    <!-- Headboard / Pillow Layer -->
    <rect x="30" y="20" width="380" height="110" rx="12" fill="#FAF5EE" stroke="#CBD5DE" stroke-width="1.5"/>
    <!-- Two Pillows with Zari Piping -->
    <rect x="50" y="35" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#B8966A" stroke-width="1.8"/>
    <line x1="60" y1="75" x2="190" y2="75" stroke="#B8966A" stroke-dasharray="3 3" stroke-width="1.2"/>
    <rect x="240" y="35" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#B8966A" stroke-width="1.8"/>
    <line x1="250" y1="75" x2="380" y2="75" stroke="#B8966A" stroke-dasharray="3 3" stroke-width="1.2"/>
    
    <!-- Main Sheet Fold & Spread -->
    <rect x="20" y="150" width="400" height="390" rx="16" fill="#F4F8FA" stroke="#1B3A4B" stroke-width="2"/>
    <!-- Block Print Body -->
    <rect x="35" y="195" width="370" height="330" fill="url(#indigoFloral)"/>
    
    <!-- Decorative Border Placket with Gold Trim -->
    <rect x="20" y="150" width="400" height="45" fill="#1B3A4B"/>
    <line x1="20" y1="195" x2="420" y2="195" stroke="#C9962F" stroke-width="3"/>
    
    <text x="220" y="178" text-anchor="middle" font-family="'Fraunces', serif" font-size="12" font-weight="600" letter-spacing="3" fill="#FAF5EE">PERCALE 300 THREAD COUNT</text>
    
    <!-- Subtle Sheet Drape Curves -->
    <path d="M20,490 Q220,530 420,490 L420,540 Q220,575 20,540 Z" fill="#1B3A4B" opacity="0.9"/>
  </g>

  <!-- Product Label -->
  <rect x="110" y="580" width="280" height="34" rx="6" fill="#FAF5EE" stroke="#1B3A4B" stroke-width="1.5"/>
  <text x="250" y="602" text-anchor="middle" font-family="'Fraunces', serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#1B3A4B">ARTISANAL BEDSHEET</text>
</svg>
