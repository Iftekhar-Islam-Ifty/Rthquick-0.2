<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="cushionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#E8DECD"/>
    </linearGradient>
    <radialGradient id="velvetGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3D7058"/>
      <stop offset="100%" stop-color="#1B3E2F"/>
    </radialGradient>
    <filter id="cushionShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B3A4B" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="500" height="650" fill="url(#cushionBg)"/>

  <!-- Back Pair Cushion (Offset Perspective) -->
  <g transform="translate(180, 80) rotate(8)" filter="url(#cushionShadow)">
    <rect x="0" y="0" width="240" height="240" rx="36" fill="#C9962F" stroke="#8B6615" stroke-width="2"/>
    <rect x="20" y="20" width="200" height="200" rx="24" fill="none" stroke="#FAF5EE" stroke-width="1.8" stroke-dasharray="6 4"/>
    <circle cx="120" cy="120" r="30" fill="#FAF5EE" opacity="0.3"/>
  </g>

  <!-- Front Main Cushion (Handloom Velvet & Zari) -->
  <g transform="translate(90, 150)" filter="url(#cushionShadow)">
    <!-- Plush Pillow Body -->
    <rect x="0" y="0" width="320" height="320" rx="44" fill="url(#velvetGlow)" stroke="#C9962F" stroke-width="2.5"/>
    
    <!-- Zari Corded Piping Border -->
    <rect x="22" y="22" width="276" height="276" rx="30" fill="none" stroke="#C9962F" stroke-width="2" stroke-dasharray="4 3"/>
    
    <!-- Intricate Gold Leaf Embroidered Centerpiece -->
    <g transform="translate(160, 160)">
      <circle cx="0" cy="0" r="65" fill="#C9962F" fill-opacity="0.15" stroke="#C9962F" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="45" fill="none" stroke="#FAF5EE" stroke-width="1.5" stroke-dasharray="3 3"/>
      
      <!-- 4 Gold Floral Leaves -->
      <path d="M0,-50 Q16,-28 0,-6 Q-16,-28 0,-50 Z" fill="#C9962F"/>
      <path d="M0,50 Q16,28 0,6 Q-16,28 0,50 Z" fill="#C9962F"/>
      <path d="M-50,0 Q-28,16 -6,0 Q-28,-16 -50,0 Z" fill="#C9962F"/>
      <path d="M50,0 Q28,16 6,0 Q28,-16 50,0 Z" fill="#C9962F"/>
      
      <!-- Central Gem / Bead -->
      <circle cx="0" cy="0" r="14" fill="#8B1E2B" stroke="#FAF5EE" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#FAF5EE"/>
    </g>

    <!-- Corner Tassels -->
    <circle cx="0" cy="0" r="8" fill="#C9962F"/>
    <circle cx="320" cy="0" r="8" fill="#C9962F"/>
    <circle cx="0" cy="320" r="8" fill="#C9962F"/>
    <circle cx="320" cy="320" r="8" fill="#C9962F"/>
  </g>

  <!-- Typography Card Banner -->
  <rect x="110" y="555" width="280" height="34" rx="6" fill="#1B3E2F"/>
  <text x="250" y="577" text-anchor="middle" font-family="'Fraunces', serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#FAF5EE">CUSHION COVER PAIR</text>
</svg>
