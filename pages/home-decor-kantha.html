  <!-- Resilient Image Fallback for GitHub Pages & static hosting -->
  <script>
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'IMG') {
        var img = e.target;
        var src = img.getAttribute('src') || '';
        var retryCount = parseInt(img.dataset.retry || '0', 10);
        if (retryCount < 2) {
          img.dataset.retry = String(retryCount + 1);
          var cleanPath = src.split('?')[0];
          if (retryCount === 0 && !cleanPath.startsWith('../') && !cleanPath.startsWith('/')) {
            img.src = '../' + src;
          }
        }
      }
    }, true);
  </script>
